      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /tally/imports:
    post:
      tags:
      - Tally
      summary: Upload Tally XML/Excel and get a preview (nothing written yet)
      operationId: previewTallyImport
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                cutover_date:
                  type: string
                  format: date
                scope:
                  type: array
                  items:
                    type: string
                    enum:
                    - groups
                    - units
                    - items
                    - customers
                    - suppliers
                    - opening_stock
                    - opening_balances
              required:
              - file
              - cutover_date
      responses:
        '201':
          description: Preview ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallyImportPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tally/imports/{id}/commit:
    post:
      tags:
      - Tally
      summary: Apply a previewed import (all-or-nothing)
      operationId: commitTallyImport
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                location_map:
                  type: object
                  properties: {}
                  additionalProperties:
                    $ref: '#/components/schemas/Id'
                  description: Tally godown name → location id
                unit_map:
                  type: object
                  properties: {}
                  additionalProperties:
                    $ref: '#/components/schemas/Id'
      responses:
        '202':
          description: Import running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tally/exports:
    post:
      tags:
      - Tally
      summary: Export vouchers/masters to Tally XML (incremental by default)
      operationId: createTallyExport
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TallyExportInput'
      responses:
        '202':
          description: Export running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /tally/syncs:
    get:
      tags:
      - Tally
      summary: Import / export history
      operationId: listTallySyncs
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TallySync'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - data
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /audit-log:
    get:
      tags:
      - Audit
      summary: Search the audit log
      operationId: listAuditLog
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - name: user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: entity
        in: query
        schema:
          type: string
      - name: entity_id
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      - name: action
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - data
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token, verified with https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttrIdPath:
      name: attrId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Field name, prefix with - for descending, e.g. -bill_date
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Free-text search (trigram)
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
    LocationId:
      name: location_id
      in: query
      schema:
        $ref: '#/components/schemas/Id'
    PartyId:
      name: party_id
      in: query
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: New UUID per user action. A retry with the same key returns the original result instead of creating a duplicate
        document.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Current bill version as an ETag, e.g. "3". Rejected with 412 VERSION_MISMATCH if someone else changed it.
  responses:
    BadRequest:
      description: Validation failed (VALIDATION_FAILED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Missing or invalid Supabase access token (UNAUTHENTICATED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role not allowed (FORBIDDEN)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (NOT_FOUND)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State or uniqueness conflict (CONFLICT, DUPLICATE, INVALID_STATE, EDIT_NOT_ALLOWED, EINVOICE_WINDOW_CLOSED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Bill changed since it was loaded (VERSION_MISMATCH)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InsufficientStock:
      description: Stock is short at the chosen location; bill not saved; Super Admin alerted (INSUFFICIENT_STOCK)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InsufficientStockProblem'
    CreditLimit:
      description: Customer credit limit exceeded (CREDIT_LIMIT_EXCEEDED)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/CreditLimitProblem'
  schemas:
    Money:
      type: string
      pattern: ^-?\d{1,12}(\.\d{1,2})?$
      description: Rupee amount as a decimal string (never a float), e.g. "12500.50"
      examples:
      - '12500.50'
    Rate:
      type: string
      pattern: ^\d{1,10}(\.\d{1,4})?$
      description: Rate or cost as a decimal string, up to 4 decimals
      examples:
      - '62.5000'
    Quantity:
      type: string
      pattern: ^-?\d{1,11}(\.\d{1,3})?$
      description: Quantity as a decimal string, up to 3 decimals
      examples:
      - '1.500'
    Percent:
      type: string
      pattern: ^\d{1,3}(\.\d{1,2})?$
      examples:
      - '18'
    Id:
      type: integer
      format: int64
      minimum: 1
    GSTIN:
      type: string
      pattern: ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][0-9A-Z]Z[0-9A-Z]$
      examples:
      - 29ABCDE1234F1Z5
    StateCode:
      type: string
      pattern: ^\d{2}$
      description: GST state code
      examples:
      - '29'
    GstRate:
      type: string
      enum:
      - '0'
      - '0.25'
      - '3'
      - '5'
      - '12'
      - '18'
      - '28'
      - '40'
      description: GST rate % as string
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
      required:
      - page
      - page_size
      - total
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
          - VALIDATION_FAILED
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - VERSION_MISMATCH
          - DUPLICATE
          - INSUFFICIENT_STOCK
          - CREDIT_LIMIT_EXCEEDED
          - EDIT_NOT_ALLOWED
          - EINVOICE_WINDOW_CLOSED
          - INVALID_STATE
          - IDEMPOTENCY_REPLAY_MISMATCH
          - RATE_LIMITED
          - INTERNAL
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: JSON pointer-ish path, e.g. lines[2].qty
              message:
                type: string
        request_id:
          type: string
      required:
      - title
      - status
      - code
      description: RFC 9457 problem details with a stable machine-readable code
    ShortLine:
      type: object
      properties:
        line_no:
          type: integer
        item_id:
          $ref: '#/components/schemas/Id'
        item_name:
          type: string
        location_id:
          $ref: '#/components/schemas/Id'
        location_name:
          type: string
        required:
          $ref: '#/components/schemas/Quantity'
        available:
          $ref: '#/components/schemas/Quantity'
        unit:
          type: string
        available_elsewhere:
          type: array
          items:
            type: object
            properties:
              location_id:
                $ref: '#/components/schemas/Id'
              location_name:
                type: string
              qty:
                $ref: '#/components/schemas/Quantity'
    InsufficientStockProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          short_lines:
            type: array
            items:
              $ref: '#/components/schemas/ShortLine'
          alert_sent:
            type: boolean
            description: Super Admin reorder alert was raised
    CreditLimitProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          credit_limit:
            $ref: '#/components/schemas/Money'
          outstanding:
            $ref: '#/components/schemas/Money'
          this_bill:
            $ref: '#/components/schemas/Money'
    ReasonInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
      required:
      - reason
    Job:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - item_import
          - tally_import
          - tally_export
          - report_export
          - einvoice
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
        progress:
          type: integer
          minimum: 0
          maximum: 100
        result_url:
          oneOf:
          - type: string
            format: uri
          - type: 'null'
        error:
          oneOf:
          - type: string
          - type: 'null'
        created_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - id
      - kind
      - status
    SignedUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
      - url
      - expires_at
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        mobile:
          oneOf:
          - type: string
          - type: 'null'
        role:
          type: string
          enum:
          - super_admin
          - admin
        is_active:
          type: boolean
        last_login_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - full_name
      - email
      - role
      - is_active
    Me:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          permissions:
            type: array
            items:
              type: string
            description: Flattened permission keys the UI uses to show/hide actions, e.g. bill.edit, bill.cancel, return.approve
    UserInvite:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        mobile:
          type: string
        role:
          type: string
          enum:
          - super_admin
          - admin
      required:
      - full_name
      - email
      - role
    UserPatch:
      type: object
      properties:
        full_name:
          type: string
        mobile:
          type: string
        role:
          type: string
          enum:
          - super_admin
          - admin
    Settings:
      type: object
      properties:
        shop_name:
          type: string
        address:
          type: string
        state_code:
          $ref: '#/components/schemas/StateCode'
        gstin:
          $ref: '#/components/schemas/GSTIN'
        phone:
          type: string
        email:
          type: string
        logo_url:
          oneOf:
          - type: string
          - type: 'null'
        bank_name:
          type: string
        bank_account_no:
          type: string
        bank_ifsc:
          type: string
        upi_id:
          type: string
        invoice_terms:
          type: string
        prices_include_gst:
          type: boolean
        default_charge_gst:
          $ref: '#/components/schemas/GstRate'
        einvoice_enabled:
          type: boolean
        number_prefixes:
          type: object
          properties: {}
          additionalProperties:
            type: string
        notification_channels:
          type: object
          properties:
            email:
              type: boolean
            whatsapp:
              type: boolean
            whatsapp_number:
              type: string
      required:
      - shop_name
      - address
      - state_code
      - gstin
    EInvoiceCredentials:
      type: object
      properties:
        provider:
          type: string
        environment:
          type: string
          enum:
          - sandbox
          - production
        username:
          type: string
        password:
          type: string
          writeOnly: true
        client_id:
          type: string
        client_secret:
          type: string
          writeOnly: true
      required:
      - provider
      - environment
      - username
      - password
    TallyMapping:
      type: object
      properties:
        sales_ledger_cash:
          type: string
        sales_ledger_account:
          type: string
        cgst_ledger:
          type: string
        sgst_ledger:
          type: string
        igst_ledger:
          type: string
        labour_ledger:
          type: string
        transport_ledger:
          type: string
        round_off_ledger:
          type: string
        cash_ledger:
          type: string
        bank_ledger:
          type: string
        purchase_ledger:
          type: string
        voucher_type_cash:
          type: string
        voucher_type_account:
          type: string
    Location:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        kind:
          type: string
          enum:
          - shop
          - godown
        address:
          oneOf:
          - type: string
          - type: 'null'
        is_default_billing:
          type: boolean
        is_active:
          type: boolean
      required:
      - id
      - name
      - kind
    LocationInput:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
          - shop
          - godown
        address:
          type: string
        is_default_billing:
          type: boolean
      required:
      - name
      - kind
    Unit:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        symbol:
          type: string
        uqc_code:
          oneOf:
          - type: string
          - type: 'null'
        decimals:
          type: integer
          minimum: 0
          maximum: 3
      required:
      - id
      - name
      - symbol
      - decimals
    UnitInput:
      type: object
      properties:
        name:
          type: string
        symbol:
          type: string
        uqc_code:
          type: string
        decimals:
          type: integer
          minimum: 0
          maximum: 3
      required:
      - name
      - symbol
    CategoryAttribute:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        label:
          type: string
        data_type:
          type: string
          enum:
          - text
          - number
          - select
        options:
          type: array
          items:
            type: string
        value_unit:
          oneOf:
          - type: string
          - type: 'null'
        is_required:
          type: boolean
        part_of_name:
          type: boolean
        sort_order:
          type: integer
      required:
      - id
      - code
      - label
      - data_type
    CategoryAttributeInput:
      type: object
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        label:
          type: string
        data_type:
          type: string
          enum:
          - text
          - number
          - select
        options:
          type: array
          items:
            type: string
        value_unit:
          oneOf:
          - type: string
          - type: 'null'
        is_required:
          type: boolean
        part_of_name:
          type: boolean
        sort_order:
          type: integer
      required:
      - code
      - label
      - data_type
    Category:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        parent_id:
          oneOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        default_hsn:
          oneOf:
          - type: string
          - type: 'null'
        default_gst:
          oneOf:
          - $ref: '#/components/schemas/GstRate'
          - type: 'null'
        description:
          oneOf:
          - type: string
          - type: 'null'
        is_active:
          type: boolean
        tally_group:
          oneOf:
          - type: string
          - type: 'null'
        units:
          type: array
          items:
            type: object
            properties:
              unit:
                $ref: '#/components/schemas/Unit'
              is_default:
                type: boolean
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/CategoryAttribute'
        item_count:
          type: integer
      required:
      - id
      - name
      - is_active
    CategoryInput:
      type: object
      properties:
        name:
          type: string
        parent_id:
          $ref: '#/components/schemas/Id'
        default_hsn:
          type: string
        default_gst:
          $ref: '#/components/schemas/GstRate'
