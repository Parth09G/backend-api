          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - data
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications/{id}/read:
