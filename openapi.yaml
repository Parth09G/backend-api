    post:
      tags:
      - Bills
      summary: Create a bill (draft, or active = save + post stock and ledger)
      operationId: createBill
      x-roles:
      - super_admin
      - admin
      description: 'For an active Cash bill the server, in one transaction, numbers the bill, deducts stock at each line''s
        location and posts the ledger and payments. If stock is short it returns 422 INSUFFICIENT_STOCK with the short lines
        and raises a Super Admin reorder alert. Account bills never touch stock. B2B active bills queue e-invoice generation
        (einvoice.status = pending).


        Super Admin and Admin.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          headers:
            ETag:
              schema:
                type: string
              description: Bill version, send back as If-Match when editing
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: 'Business rule failure: INSUFFICIENT_STOCK or CREDIT_LIMIT_EXCEEDED'
          content:
            application/problem+json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/InsufficientStockProblem'
                - $ref: '#/components/schemas/CreditLimitProblem'
