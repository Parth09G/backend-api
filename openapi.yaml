          type: string
          enum:
          - json
          - xlsx
          - pdf
        description: json returns rows; xlsx/pdf return a signed link, or 202 + job for large ranges
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Rows (json) or signed link (xlsx/pdf)
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    columns:
                      type: array
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                          label:
                            type: string
                          type:
                            type: string
                            enum:
                            - text
                            - money
                            - qty
                            - date
                            - percent
                    rows:
                      type: array
                      items:
                        type: object
                        properties: {}
                        additionalProperties: true
                    totals:
                      type: object
                      properties: {}
                      additionalProperties: true
                    meta:
                      $ref: '#/components/schemas/PageMeta'
                - $ref: '#/components/schemas/SignedUrl'
        '202':
          description: Large export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /notifications:
    get:
      tags:
