openapi: 3.1.0
info:
  title: Billing & Inventory API
  version: 1.0.0
  description: 'REST API for the construction-material billing and inventory system (Go backend on Railway, Supabase PostgreSQL).


    * Auth: send the Supabase Auth access token as `Authorization: Bearer <jwt>`. The API verifies it against the project
    JWKS and loads the role from app.app_user.

    * Money, rates and quantities are **decimal strings**, never JSON numbers.

    * Errors use RFC 9457 `application/problem+json` with a stable `code`.

    * Document-creating POSTs require an `Idempotency-Key` header. Bill edits and cancels require `If-Match` with the bill
    version.

    * `x-roles` on each operation lists the roles allowed.'
servers:
- url: https://api.example.in/api/v1
  description: Production (Railway)
- url: http://localhost:8080/api/v1
  description: Local
security:
- supabaseJwt: []
tags:
- name: System
  description: Health, current user, lookups, global search and job status
- name: Users
  description: Invite and manage users (Supabase Auth + app.app_user)
- name: Settings
  description: Shop profile, e-invoice credentials, Tally mapping
- name: Locations
  description: Shop and godowns
- name: Catalogue
  description: Units, categories, category attributes
- name: Items
  description: Products, stock per location, stock ledger, price hints
- name: Parties
  description: Customers and dealers, ledgers, statements
- name: Bills
  description: Cash and Account bills, edits, cancellations, Account copies, PDF, e-invoice, e-way bill
- name: Payments
  description: Receipts and dealer payments, cheques
- name: Returns
  description: Sales returns and credit notes with approval
- name: Purchases
  description: Dealer purchases and purchase returns
- name: Stock
  description: Transfers, adjustments and physical counts
- name: Dashboard
  description: Dashboard widgets
- name: Reports
  description: Reports and exports
- name: Notifications
  description: Alerts for users
- name: Tally
  description: Tally import and export
- name: Audit
  description: Audit log
paths:
  /health:
    get:
      tags:
      - System
      summary: Liveness and database check
      operationId: health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  db:
                    type: string
                  version:
                    type: string
  /me:
    get:
      tags:
      - System
      summary: Current user, role and permission keys
      operationId: getMe
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /search:
    get:
      tags:
      - System
      summary: Global search across items, customers and bills (command palette)
      operationId: globalSearch
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /lookups/states:
    get:
      tags:
      - System
      summary: GST state codes and names
      operationId: listStates
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      $ref: '#/components/schemas/StateCode'
                    name:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /jobs/{id}:
    get:
      tags:
      - System
      summary: Status of a background job (imports, exports, large reports)
      operationId: getJob
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /users:
    get:
      tags:
      - Users
      summary: List users
      operationId: listUsers
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Users
      summary: Invite a user (creates Supabase Auth user + profile, sends invite email)
      operationId: inviteUser
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInvite'
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}:
    patch:
      tags:
      - Users
      summary: Update name, mobile or role
      operationId: updateUser
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}/deactivate:
    post:
      tags:
      - Users
      summary: Deactivate user (blocks API immediately; last Super Admin cannot be deactivated)
      operationId: deactivateUser
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/{id}/reactivate:
    post:
      tags:
      - Users
      summary: Reactivate user
      operationId: reactivateUser
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /users/{id}/password-reset:
    post:
      tags:
      - Users
      summary: Send password-reset email
      operationId: sendPasswordReset
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - $ref: '#/components/parameters/UserIdPath'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /settings:
    get:
      tags:
      - Settings
      summary: Shop settings
      operationId: getSettings
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags:
      - Settings
      summary: Update shop settings
      operationId: updateSettings
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /settings/logo:
    put:
      tags:
      - Settings
      summary: Upload shop logo (PNG/JPG, max 1 MB)
      operationId: uploadLogo
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /settings/einvoice-credentials:
    put:
      tags:
      - Settings
      summary: Store GSP/ASP credentials (write-only; stored encrypted)
      operationId: setEInvoiceCredentials
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EInvoiceCredentials'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /settings/einvoice-credentials/test:
    post:
      tags:
      - Settings
      summary: Test GSP login
      operationId: testEInvoiceCredentials
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /settings/tally-mapping:
    get:
      tags:
      - Settings
      summary: Tally ledger and voucher-type mapping
      operationId: getTallyMapping
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallyMapping'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    put:
      tags:
      - Settings
      summary: Update Tally mapping
      operationId: updateTallyMapping
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TallyMapping'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TallyMapping'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /locations:
    get:
      tags:
      - Locations
      summary: List shop and godowns
      operationId: listLocations
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Locations
      summary: Add a location
      operationId: createLocation
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /locations/{id}:
    patch:
      tags:
      - Locations
      summary: Update a location
      operationId: updateLocation
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /units:
    get:
      tags:
      - Catalogue
      summary: List units
      operationId: listUnits
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Catalogue
      summary: Create a unit
      operationId: createUnit
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
  /units/{id}:
    patch:
      tags:
      - Catalogue
      summary: Rename a unit
      operationId: updateUnit
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories:
    get:
      tags:
      - Catalogue
      summary: List categories with units and attributes
      operationId: listCategories
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - name: include_inactive
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Catalogue
      summary: Create category with its units and attributes (wizard)
      operationId: createCategory
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
  /categories/{id}:
    get:
      tags:
      - Catalogue
      summary: Get category
      operationId: getCategory
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Catalogue
      summary: Update category name, defaults, units
      operationId: updateCategory
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /categories/{id}/deactivate:
    post:
      tags:
      - Catalogue
      summary: Deactivate category (only when it has no active items)
      operationId: deactivateCategory
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /categories/{id}/attributes:
    post:
      tags:
      - Catalogue
      summary: Add an attribute to a category
      operationId: addCategoryAttribute
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAttributeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttribute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /categories/{id}/attributes/{attrId}:
    patch:
      tags:
      - Catalogue
      summary: Update an attribute
      operationId: updateCategoryAttribute
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/AttrIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAttributeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAttribute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Catalogue
      summary: Remove an attribute (only if no item uses it)
      operationId: deleteCategoryAttribute
      x-roles:
      - super_admin
      description: '**Super Admin only.**'
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/AttrIdPath'
      responses:
        '204':
          description: Done
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /categories/{id}/import-template:
    get:
      tags:
      - Catalogue
      summary: Excel template whose columns follow this category's attributes
      operationId: getItemImportTemplate
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
  /items:
    get:
      tags:
      - Items
      summary: List / search items with stock (inventory grid)
      operationId: listItems
      x-roles:
      - super_admin
      - admin
      description: Super Admin and Admin.
      parameters:
      - $ref: '#/components/parameters/Q'
      - name: category_id
        in: query
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/LocationId'
      - name: stock_status
        in: query
        schema:
          type: string
          enum:
          - ok
          - low
          - out
      - name: attr
        in: query
        schema:
          type: object
          properties: {}
          additionalProperties:
            type: string
        description: Attribute filters, e.g. attr[brand]=Tata&attr[size]=12 mm
        style: deepObject
        explode: true
      - name: include_inactive
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - data
                - meta
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags:
      - Items
      summary: Create item (optional opening stock per location)
      operationId: createItem
      x-roles:
      - super_admin
      - admin
      description: 'Validates attributes against the category definition and rejects duplicates (DUPLICATE).


        Super Admin and Admin.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
