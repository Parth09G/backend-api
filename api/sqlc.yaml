version: "2"
sql:
  - engine: postgresql
    # The migrations create everything after `SET search_path = app`, which
    # sqlc does not follow, so tables appear unqualified here. Queries use
    # unqualified names too; at runtime the pool's search_path is app.
    schema:
      - db/sqlc_stub.sql
      - ../supabase/migrations
    queries: db/queries
    gen:
      go:
        package: dbq
        out: internal/db/dbq
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          # Money, rates and quantities: never float64 (HLD 6.3).
          - db_type: pg_catalog.numeric
            go_type: github.com/shopspring/decimal.Decimal
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              import: github.com/shopspring/decimal
              type: Decimal
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.timestamptz
            go_type: time.Time
          - db_type: pg_catalog.timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
