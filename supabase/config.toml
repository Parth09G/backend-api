# Supabase CLI configuration (local stack + settings pushed with `supabase config push`).
# HLD v2.2 §6.7: business tables live in schema "app", which is NOT exposed here.
project_id = "billing-inventory"

[api]
enabled = true
port = 54321
# Do not add "app" or "river": the browser must never reach business tables.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "session"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

# Private bucket: invoice PDFs, logo, Tally/Excel exports. API hands out signed URLs.
[storage.buckets.documents]
public = false
file_size_limit = "20MiB"
allowed_mime_types = [
  "application/pdf",
  "image/png",
  "image/jpeg",
  "image/webp",
  "application/xml",
  "text/xml",
  "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
  "application/gzip",
  "application/octet-stream",
]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# FR-AU-01: no public sign-up; the Super Admin invites users through the API.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.sms]
enable_signup = false

[analytics]
enabled = false
